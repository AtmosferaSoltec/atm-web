# Production stack of the landing. GitHub Actions copies it to /opt/atm-web on
# each deploy; it is not edited by hand on the server.
#
# It never builds: the image is compiled once in CI and published to GHCR.
# The landing is static and has no configuration or secrets, so there is no .env.
# The HEALTHCHECK comes with the image (Dockerfile) and asks for /healthz.

networks:
  shared:
    name: atm-network
    external: true

services:
  app:
    image: ghcr.io/atmosferasoltec/atm-web:${IMAGE_TAG:-latest}
    container_name: atm-web
    # Loopback only: the host nginx (atmosferast.com) is what publishes it.
    ports:
      - '127.0.0.1:3090:8080'
    networks:
      - shared
    restart: unless-stopped
    security_opt: ['no-new-privileges:true']
    deploy:
      resources:
        limits:
          memory: 128m
